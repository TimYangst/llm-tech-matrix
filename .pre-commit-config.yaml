# Pre-commit hooks. Install once with: `uv run pre-commit install`
# Run manually across the repo with: `uv run pre-commit run --all-files`
#
# Goal: keep this fast and mechanical. Schema validation lives in CI, not here.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-toml
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-tables==1.0.0
          - mdformat-frontmatter==2.0.10
        # Pipeline-rendered outputs — the formatter must not touch them, or the
        # generator's output and the formatter's output fight and CI can never be green.
        exclude: ^(data/extracted/.*\.md|data/reports/.*\.md)$
