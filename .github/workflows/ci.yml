# Lightweight presubmit CI.
#
# Runs on every pull request and on pushes to main. Three checks:
#   1. pre-commit (ruff lint + format, mdformat, hygiene hooks) — same config
#      developers run locally, so CI cannot disagree with local hooks.
#   2. Schema validation of data/extracted/*.json — enforces the "schema
#      strictness" cardinal rule from CLAUDE.md.
#   3. Technique-registry validation — catches controlled-vocabulary drift and a
#      stale generated index (data/reports/, data/extracted/README.md).
#
# GitHub Actions is free for public repositories with no minute limit.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Sync dependencies (incl. dev group)
        run: uv sync --frozen

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Validate extractions against schema
        run: uv run python scripts/validate_extractions.py

      - name: Validate technique registry + generated index
        run: uv run python scripts/validate_registry.py
