[project]
name = "llm-tech-matrix"
version = "0.1.0"
description = "LLM Tech Evolution Matrix — schema-driven extraction and synthesis pipeline for analyzing mainstream AI models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TimYangst", email = "yt0701@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tech_matrix"]
