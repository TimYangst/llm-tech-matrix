[project]
name = "llm-tech-matrix"
version = "0.1.0"
description = "LLM Tech Evolution Matrix — schema-driven extraction and synthesis pipeline for analyzing mainstream AI models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TimYangst", email = "yt0701@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tech_matrix"]

[dependency-groups]
dev = [
    "mdformat>=0.7.22",
    "mdformat-frontmatter>=2.0.10",
    "mdformat-gfm>=1.0.0",
    "mdformat-tables>=1.0.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]

# --- Lint & format ---------------------------------------------------------
# Aligned with Google's Python style guide (https://google.github.io/styleguide/pyguide.html)
# but pragmatic: line length 100, no forced docstrings on every symbol yet.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data/sources", ".venv"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # flake8-bugbear
  "SIM",      # flake8-simplify
  "RUF",      # ruff-specific
  "D",        # pydocstyle (Google convention; "missing docstring" rules disabled below)
]
ignore = [
  # Don't force docstrings on every symbol — only enforce style on those that exist.
  "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
  # D213 conflicts with Google's D212 (summary on first line).
  "D203",  # 1 blank line required before class docstring
  "D213",  # multi-line summary on second line
  "E501",  # line length — formatter handles it
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
