[project]
name = "llm-oss-summary"
version = "0.1.0"
description = "LLM Tech Evolution Matrix — schema-driven extraction and synthesis pipeline for analyzing mainstream AI models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_oss_summary"]
